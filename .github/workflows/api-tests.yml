name: API compatibility tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system MPI runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest pandas

      - name: Install DESI cosmology packages
        run: python -m pip install git+https://github.com/cosmodesi/desilike.git

      - name: Record installed package versions
        run: python -m pip freeze

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Run project unit tests
        run: python -m pytest -q tests/test_core_modules.py

      - name: Run external API compatibility tests
        run: python -m pytest -q tests/test_external_apis.py
